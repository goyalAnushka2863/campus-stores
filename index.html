<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Campus Stores · Media equipment desk</title>
    <link rel="stylesheet" href="styles.css" />
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
  </head>
  <body>
    <div id="campus-stores" class="app">
      <header class="topbar">
        <div class="brand">
          <h1>Campus Stores</h1>
          <p>Media equipment desk</p>
        </div>
        <div class="desk-time">
          <span class="desk-time-label">Desk time</span>
          <strong data-clock>Friday · 3:45 pm</strong>
          <button class="btn btn-ghost" data-action="advance" data-val="">
            Move to return time
          </button>
        </div>
        <button class="btn btn-ghost" data-action="restart">Restart sample shift</button>
      </header>

      <section class="shift-card">
        <h2 data-shift-title>Pickup at the counter</h2>
        <p data-shift>
          Kabir is here at the counter for the Film Society screening. The film
          starts at four. Can he leave with everything he needs?
        </p>
      </section>

      <nav class="tabs" data-nav aria-label="Desk pages"></nav>

      <main data-page></main>

      <footer class="statusbar">
        <span data-status>Sample shift · All records are fictional.</span>
      </footer>
    </div>
    <script src="app.js"></script>
  </body>
</html>
